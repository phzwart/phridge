[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phridge"
version = "0.1.0"
description = "Bridge between Phenix/cctbx and a PyTorch worker via Redis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "phridge contributors" }]
dependencies = [
    "numpy>=1.22",
    "redis>=5.0",
    "pydantic>=2.4",
]

[project.optional-dependencies]
client = ["cctbx-base"]
cctbx = ["cctbx-base"]
worker = ["torch"]
dev = [
    "pytest>=7.4",
    "fakeredis>=2.23",
    "linkml>=1.8",
    "cctbx-base",
]

[project.scripts]
phridge-worker = "phridge.worker.runner:main"
phridge-ops = "phridge.ops:main"

[tool.hatch.build.targets.sdist]
include = ["schema", "src/phridge", "README.md", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "phridge/schema"
