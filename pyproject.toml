[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phridge"
version = "0.1.0"
description = "Bridge between Phenix/cctbx and a PyTorch worker via Redis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "phridge contributors" }]
dependencies = [
    "numpy>=1.22",
    "redis>=5.0",
    "pydantic>=2.4",
]

[project.optional-dependencies]
client = ["cctbx-base"]
cctbx = ["cctbx-base"]
worker = ["torch"]
triton = ["torch", "triton"]
numba = ["numba"]
finufft = ["torch", "pytorch-finufft"]
nufft = ["pytorch-finufft"]
agentsg = [
    "agentsg @ git+https://github.com/phzwart/agentsg.git#subdirectory=agentsg",
]
dev = [
    "pytest>=7.4",
    "fakeredis>=2.23",
    "linkml>=1.8",
    "cctbx-base",
    "torch",
    "numba",
    "pytorch-finufft",
]

[project.scripts]
phridge = "phridge.cli:main"
phridge-worker = "phridge.worker.runner:main"
phridge-cctbx-worker = "phridge.cctbx_worker.runner:main"
phridge-ops = "phridge.ops:main"
phridge-view = "phridge.tools.viewer:main"

[project.entry-points."phridge.plugins"]
ten_eyck = "phridge.transforms.fourier.ten_eyck:register"
nufft = "phridge.transforms.fourier.nufft:register"
direct = "phridge.transforms.fourier.direct:register"
torch_geometry = "phridge.r.restraints.torch_geometry:register"
distance_mask = "phridge.r.components:register"
amplitude = "phridge.d.rules.amplitude:register"
mli_quad = "phridge.d.rules.mli_quad:register"
q_components = "phridge.q.manifests:register"
spatial_sigma_a = "phridge.q.error_models.spatial:register"
identity = "phridge.transforms.observation.identity:register"
perturbation_modes = "phridge.r.generators.perturbation_modes:register"
s_family = "phridge.report.s_family_manifest:register"
ensemble = "phridge.tools.ensemble:register"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["src/phridge", "README.md", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "gpu: requires CUDA torch worker",
    "slow: large-N / long-running",
    "boundaries: import-wall checks over src/phridge",
    "legacy: quarantined Phenix-era loops",
]

[tool.hatch.build.targets.wheel.force-include]
"src/phridge/transforms/fourier/ten_eyck/stamp_cpp/kernels.h" = "phridge/transforms/fourier/ten_eyck/stamp_cpp/kernels.h"
"src/phridge/transforms/fourier/ten_eyck/stamp_cpp/stamp.cpp" = "phridge/transforms/fourier/ten_eyck/stamp_cpp/stamp.cpp"
"src/phridge/transforms/fourier/ten_eyck/stamp_cuda/kernels.cuh" = "phridge/transforms/fourier/ten_eyck/stamp_cuda/kernels.cuh"
"src/phridge/transforms/fourier/ten_eyck/stamp_cuda/stamp.cu" = "phridge/transforms/fourier/ten_eyck/stamp_cuda/stamp.cu"
